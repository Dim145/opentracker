packages:
  - 'apps/*'
  - 'packages/*'

# Hoist dependencies that have peer-dep issues with auto-install-peers
shamefullyHoist: false

# DEUX versions de TypeScript, volontairement. Ne pas « harmoniser ».
#
#   racine     : ^7.0.2  — vérifie l'API (`tsc -p apps/api/.nitro/…`)
#   apps/web   : ~5.9.3  — vérifie le front (`nuxt typecheck`, donc vue-tsc)
#
# TypeScript 7 est le portage natif en Go. Son export principal ne contient
# plus le compilateur : `exports["."]` pointe sur `lib/version.cjs`, et
# `require('typescript').createProgram` vaut `undefined` (mesuré sur 7.0.2).
# Seules des entrées `./unstable/*` exposent une API, encore instable.
#
# vue-tsc 3.3.11 déclare pourtant `peerDependencies: { typescript: ">=5.0.0" }`.
# Cette plage est fausse pour 7.x : rien n'empêche donc quelqu'un de retirer le
# pin de `apps/web`, de laisser pnpm résoudre le TypeScript de la racine, et de
# casser `nuxt typecheck` sans qu'aucun avertissement de pair ne le signale.
# Le pin EST le garde-fou. Il tombera quand volar saura parler à l'API
# `unstable` — pas avant.

# pnpm 11 asks before removing node_modules when the lockfile has moved enough
# to invalidate it, and refuses when there is no TTY:
#   ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY
# GitHub Actions sets CI=true so it is unaffected, but `docker build` does not,
# so the image builds would fail on it. Declared here rather than exported as
# CI=true in each Dockerfile: one place, and it cannot be forgotten in a new one.
confirmModulesPurge: false

# ── Supply-chain hardening ───────────────────────────────────────────────────
# The npm registry has repeatedly been the delivery vehicle for compromised
# releases published from hijacked maintainer accounts, and the window between
# publication and takedown is measured in hours. These three settings buy that
# window back.
#
#   minimumReleaseAge  a version must have existed for 24 h before pnpm will
#                      install it, transitive dependencies included. Malicious
#                      publishes are typically pulled well inside that.
#   trustPolicy        refuse an update that LOWERS a package's trust level
#                      compared with its previous releases.
#   blockExoticSubdeps sub-dependencies may only come from a real registry —
#                      never a git URL or a tarball a compromised manifest
#                      points at. The default since pnpm 11; kept explicit so
#                      the intent survives a future default change.
minimumReleaseAge: 1440
trustPolicy: no-downgrade
blockExoticSubdeps: true

# One narrow exception, and it is narrow on purpose. `no-downgrade` compares a
# resolved version against the highest trust level ANY previous release of that
# package reached — across majors. semver 6.3.1 is the last release of the 6.x
# line, which predates npm provenance entirely (6.1.3, 6.2.0 and 6.3.0 are all
# unattested too); the "downgrade" is measured against attested 7.x. It arrives
# only through @babel/core and two @babel/helper-* packages, so it is
# build-time, and it was published by npm's own maintainer account.
#
# This is the false positive pnpm tracks as issue #10202. Anything else that
# trips the policy should be fixed by moving to an attested version, not by
# being added here.
trustPolicyExclude:
  - 'semver@6.3.1'

# ── Moved out of package.json's `pnpm` field ─────────────────────────────────
# pnpm 11 no longer reads configuration from package.json: only auth and
# registry settings come from .npmrc, and everything else lives here.
overrides:
  "node-datachannel": "npm:empty-npm-package@1.0.0"
  "webrtc-polyfill": "npm:empty-npm-package@1.0.0"
  "@thaunknown/simple-peer": "npm:empty-npm-package@1.0.0"
  "esbuild": "^0.28.2"
  "shell-quote": "^1.11.0"
  # `isomorphic-dompurify` 4.x tire `dompurify ^3.4.12` ; cette contrainte garde
  # le plancher au-dessus des contournements corrigés en 3.4.16. Le dernier,
  # GHSA-p98j-92pf-mc4p : en mode IN_PLACE, un nœud qu'un hook `afterSanitize*`
  # détache garde ses gestionnaires d'événements armés. Non atteignable chez nous —
  # nous ne sanitisons jamais en place, et notre seul hook `afterSanitizeAttributes`
  # (apps/web/app/utils/markdown.ts) pose rel/target sans rien détacher.
  "dompurify": "^3.4.16"
  "launch-editor": "^2.14.2"
  "devalue": "^5.9.4"
  "ws@8": "^8.20.1"
  "brace-expansion@1": "^1.1.21"
  "brace-expansion@2": "^2.1.7"
  "brace-expansion@5": "^5.0.10"
  # GHSA-2883-xcg3-v3hh (<4.3.2) : `maxTotalMergeKeys` ne compte pas les
  # mappings vides, donc une séquence de fusions vides brûle du CPU sans
  # jamais atteindre la limite. Dépendance de CONSTRUCTION (@rollup/plugin-yaml
  # lit NOTRE yaml au build), jamais exposée à une entrée hostile.
  "js-yaml@4": "^4.3.2"
  "nanoid@3": "^3.3.16"
  "postcss@8": "^8.5.23"
  "tar@7": "^7.5.21"
  "undici@7": "^7.29.0"
  # Onze avis publiés fin septembre 2026 sur la branche 8 (<8.10.2), dont : options
  # de connexion perdues par BalancedPool, donc certificat TLS non vérifié
  # (GHSA-w293-vg96-wgc3), empoisonnement de cache inter-origine
  # (GHSA-vp8m-p9jh-q5pm), Set-Cookie servi d'un utilisateur à l'autre par un cache
  # partagé (GHSA-2jfj-6hjv-fm6j), et plusieurs dénis de service (WebSocket,
  # décompression, RetryHandler). Arrive par nuxt, unifont et jsdom.
  "undici@8": "^8.10.2"
  # GHSA-w27v-7q3p-w38r et GHSA-4vpr-x523-8j87 (<4.1.0) : le plugin `removeScripts`
  # laissait passer des liens exécutables (préfixes de namespace, tabulations dans
  # le schéma d'URL) et le HTML des `<foreignObject>`. Ce plugin est optionnel et
  # nous ne l'activons pas : svgo n'arrive que par postcss-svgo (cssnano), qui
  # minifie NOS propres SVG au build.
  "svgo@4": "^4.1.0"
  "@babel/core@7": "^7.29.6"
  "@types/node": "^24.13.3"
  "@peculiar/asn1-android": "^2.9.4"
  "@peculiar/asn1-cms": "^2.9.4"
  "@peculiar/asn1-csr": "^2.9.4"
  "@peculiar/asn1-ecc": "^2.9.4"
  "@peculiar/asn1-pfx": "^2.9.4"
  "@peculiar/asn1-pkcs8": "^2.9.4"
  "@peculiar/asn1-pkcs9": "^2.9.4"
  "@peculiar/asn1-rsa": "^2.9.4"
  "@peculiar/asn1-schema": "^2.9.4"
  "@peculiar/asn1-x509": "^2.9.4"
  "@peculiar/asn1-x509-attr": "^2.9.4"
  # Deux avis GHSA sur des dépendances de CONSTRUCTION, remontés le 2026-09-02.
  # Ni l'un ni l'autre n'est atteignable à l'exécution — browserslist résout des
  # cibles de navigateur au build, postcss-selector-parser analyse nos propres
  # sélecteurs — mais le verrou portait les deux versions, la corrigée et la
  # vulnérable, et une contrainte coûte moins qu'une ligne d'exception dans un
  # rapport d'audit.
  #   browserslist            GHSA-c83g-rgw3-j3cx, GHSA-73wf-gq98-2v4g (<=4.28.6)
  #   postcss-selector-parser GHSA-w9m9-85wc-3x92 (<6.1.3 et 7.0-7.1.2)
  # Les deux branches sont relevées depuis pour GHSA-rj75-hqrm-r3gf : un sélecteur
  # plat (`.a.a.a…`) s'analyse en temps quadratique. Même statut — la 7 n'arrive
  # que par cssnano, postcss-nesting et @csstools, la 6 que par tailwindcss 3 et
  # postcss-nested, tous sur nos propres feuilles. L'avis ne déclare corrigée que
  # la 7.1.6 et sa plage (`< 7.1.6`) couvre donc toute la branche 6 ; la 6.1.5 en
  # est pourtant le rétroportage exact (mêmes trois passes réécrites en Set,
  # vérifié par diff des tarballs). Dependabot continuera de la signaler tant que
  # l'avis n'aura pas été amendé.
  "browserslist": "^4.28.8"
  "postcss-selector-parser@6": "^6.1.5"
  "postcss-selector-parser@7": "^7.1.6"
  # GHSA-68fv-2mgg-jv7q (<1.2.2) : dans une source map indexée, un décalage de
  # ligne de section démesuré bloque la boucle d'événements — la faille est dans
  # la LECTURE d'une source map. Un seul chemin d'exécution : css-tree, avec
  # lequel l'API analyse les thèmes, mais qui n'importe que SourceMapGenerator
  # (l'écriture). Partout ailleurs (compilateur Vue, postcss, magicast), c'est la
  # construction, qui ne lit que nos propres sources.
  "source-map-js": "^1.2.2"
  # GHSA-jggr-w7fw-pc2j (<4.1.0) : épuisement de pile sur une valeur profondément
  # imbriquée. N'arrive que par pino-pretty, que le logger ne charge que hors
  # production (apps/api/utils/logger.ts).
  "fast-copy": "^4.1.0"
  # GHSA-v5rq-49vh-5v5c : `@simple-git/argv-parser` <2.0.1 ne range pas `VISUAL`
  # (le repli d'éditeur de git) parmi les réglages dangereux, ce qui contourne la
  # garde `allowUnsafeEditor`. Arrive par simple-git 3.36, lui-même tiré par
  # @nuxt/devtools — donc en développement seulement.
  #
  # Monter simple-git en 4.x, qui tire 2.0.1 d'office, CASSE `nuxt prepare` :
  # la 4.x n'a plus d'export par défaut et devtools fait `import Git from
  # 'simple-git'`. On force donc le parseur seul sous simple-git 3.36. Vérifié
  # sur les deux tarballs : simple-git 3.36 n'en appelle que
  # `vulnerabilityCheck(tokens, env)`, de signature et de retour identiques en
  # 2.0.1 ; la majeure ne fait qu'ajouter des catégories refusées (include.path,
  # url.*.insteadOf, --exec-path…), que simple-git 3.36 rejette comme les autres.
  "@simple-git/argv-parser": "^2.0.1"
  # Corollaire OBLIGATOIRE du précédent. `args-pathspec` reconnaît ses objets par
  # un WeakMap propre au module : simple-git crée ses pathspecs avec SON exemplaire,
  # le parseur les teste avec le sien. Laissé à lui-même, pnpm garde 1.0.3 pour
  # simple-git et tire 1.0.4 pour le parseur 2.0.1 — deux modules, deux WeakMap,
  # et chaque pathspec redevient un argument ordinaire aux yeux du parseur. Le
  # code des deux versions est identique ; une seule copie satisfait ^1.0.3 et
  # ^1.0.4.
  "@simple-git/args-pathspec": "^1.0.4"
  # Trois avis sur `launch-editor` sont publiés CONTRE vite : vite ne le déclare
  # pas en dépendance, il en livre sa propre copie dans son bundle
  # (dist/node/chunks/node.js). Relever le paquet autonome (ci-dessus, 2.14.2,
  # qui n'arrive que par @nuxt/devtools et @nuxt/devtools-wizard) ne corrige donc
  # pas vite ; 8.2.4 est la première version qui porte le correctif.
  "vite": "^8.2.4"

# Was `onlyBuiltDependencies`. pnpm 11 merges onlyBuiltDependencies,
# neverBuiltDependencies and ignoredBuiltDependencies into one map, so a
# package is now named with an explicit true/false rather than by which
# list it sat in. These four have install scripts we do want to run.
allowBuilds:
  "@parcel/watcher": true
  "esbuild": true
  "sharp": true
  "vue-demi": true
  # Denied explicitly, which pnpm 11 requires: it ERRORS on a package that has
  # an install script and is not named in this map, where pnpm 10 only warned
  # (ERR_PNPM_IGNORED_BUILDS). pnpm even writes the placeholder lines into this
  # file for you. Both are optional native accelerators for `ws`, which works
  # without them, so there is no reason to compile C++ on every builder.
  "bufferutil": false
  "utf-8-validate": false
