{{- if .Values.api.enabled }}
{{- $c := "api" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trackarr.fullname" . }}-api
  labels:
    {{- include "trackarr.componentLabels" (dict "ctx" $ "component" $c) | nindent 4 }}
  annotations:
    {{- include "trackarr.annotations" . | nindent 4 }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  {{- if and .Values.api.uploads.enabled (not .Values.api.uploads.existingClaim) (eq .Values.api.uploads.accessMode "ReadWriteOnce") }}
  # A ReadWriteOnce volume can only be attached to one node, so a rolling
  # update would deadlock: the new pod waits for a volume the old one still
  # holds. Recreate accepts the downtime instead of hanging.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "trackarr.componentSelectorLabels" (dict "ctx" $ "component" $c) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "trackarr.componentSelectorLabels" (dict "ctx" $ "component" $c) | nindent 8 }}
        {{- with .Values.api.podLabels }}{{ toYaml . | nindent 8 }}{{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.api.podAnnotations }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "trackarr.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "trackarr.podSecurityContext" . | nindent 8 }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.topologySpreadConstraints }}
      topologySpreadConstraints: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "trackarr.image" (dict "ctx" $ "image" .Values.api.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "trackarr.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.api.containerPort }}
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          envFrom:
            {{- include "trackarr.envFrom" . | nindent 12 }}
          env:
            - name: NITRO_PORT
              value: {{ .Values.api.containerPort | quote }}
            - name: NITRO_HOST
              value: "0.0.0.0"
            {{- include "trackarr.dbEnv" . | nindent 12 }}
            {{- if .Values.api.runMigrations }}
            {{- include "trackarr.dbMigrationEnv" . | nindent 12 }}
            {{- else }}
            - name: SKIP_DB_MIGRATIONS
              value: "true"
            {{- end }}
            - name: DB_POOL_MAX
              value: {{ .Values.api.dbPoolMax | quote }}
            {{- include "trackarr.redisEnv" . | nindent 12 }}
            - name: TRUST_PROXY
              value: {{ .Values.api.trustProxy | quote }}
            {{- if .Values.api.uploads.enabled }}
            - name: UPLOADS_DIR
              value: {{ .Values.api.uploads.mountPath | quote }}
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - name: METRICS_ENABLED
              value: "true"
            - name: METRICS_PORT
              value: {{ .Values.metrics.port | quote }}
            - name: METRICS_PATH
              value: {{ .Values.metrics.path | quote }}
            # Prometheus scrapes from another pod, so loopback is not enough.
            # The API warns when this is opened without a token, which is why
            # METRICS_AUTH_TOKEN comes from the app Secret via envFrom above.
            - name: METRICS_HOST
              value: "0.0.0.0"
            {{- end }}
            {{- include "trackarr.metadataEnv" . | nindent 12 }}
            {{- with .Values.config.extraEnv }}{{ toYaml . | nindent 12 }}{{- end }}
            {{- with .Values.api.extraEnv }}{{ toYaml . | nindent 12 }}{{- end }}
          startupProbe:
            httpGet: { path: /api/health, port: http }
            # Generous: the first replica to boot runs the migrations, and the
            # others block on the advisory lock until it is done.
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
          livenessProbe:
            # Deliberately a socket check, not /api/health. That endpoint
            # reports the DATABASE's health, so using it for liveness turns a
            # 30 s Postgres failover into every replica being killed at once —
            # a longer outage and a reconnect storm when Postgres returns.
            # Readiness above already pulls a dependency-less pod out of the
            # Service; liveness should only ask whether the process is alive.
            tcpSocket: { port: http }
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.api.uploads.enabled }}
            - name: uploads
              mountPath: {{ .Values.api.uploads.mountPath }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.api.uploads.enabled }}
        - name: uploads
          persistentVolumeClaim:
            claimName: {{ include "trackarr.uploadsClaimName" . }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "trackarr.fullname" . }}-api
  labels:
    {{- include "trackarr.componentLabels" (dict "ctx" $ "component" $c) | nindent 4 }}
  {{- with .Values.api.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
    {{- if .Values.metrics.enabled }}
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
    {{- end }}
  selector:
    {{- include "trackarr.componentSelectorLabels" (dict "ctx" $ "component" $c) | nindent 4 }}
{{- if and .Values.api.uploads.enabled (not .Values.api.uploads.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "trackarr.uploadsClaimName" . }}
  labels:
    {{- include "trackarr.componentLabels" (dict "ctx" $ "component" $c) | nindent 4 }}
  annotations:
    # Uploaded torrent files and images are not reproducible. Keep the claim
    # when the release goes away.
    helm.sh/resource-policy: keep
    {{- include "trackarr.annotations" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.api.uploads.accessMode }}
  resources:
    requests:
      storage: {{ .Values.api.uploads.size }}
  {{- if .Values.api.uploads.storageClass }}
  storageClassName: {{ .Values.api.uploads.storageClass }}
  {{- end }}
{{- end }}
{{- end }}
