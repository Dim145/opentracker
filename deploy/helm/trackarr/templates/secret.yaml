{{- if .Values.secrets.create }}
{{- if .Values.secrets.existingSecret }}
{{- fail "set either secrets.create or secrets.existingSecret, not both" }}
{{- end }}
{{- $ipHash := include "trackarr.stableSecret" (dict "ctx" $ "key" "IP_HASH_SECRET" "override" .Values.secrets.ipHashSecret "len" 64) }}
{{- if lt (len $ipHash) 32 }}
{{- fail "secrets.ipHashSecret must be at least 32 characters — the tracker refuses to start otherwise" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "trackarr.secretName" . }}
  labels:
    {{- include "trackarr.labels" . | nindent 4 }}
  annotations:
    {{- include "trackarr.annotations" . | nindent 4 }}
    # Generated once and read back on every upgrade; see trackarr.stableSecret.
    # Keeping it on an uninstall would leave a Secret nothing owns, so it is
    # deliberately NOT marked resource-policy: keep. Copy the values out before
    # you uninstall a release you intend to recreate.
    trackarr.io/generated: "true"
type: Opaque
stringData:
  NUXT_SESSION_SECRET: {{ include "trackarr.stableSecret" (dict "ctx" $ "key" "NUXT_SESSION_SECRET" "override" .Values.secrets.sessionSecret "len" 64) | quote }}
  ADMIN_API_KEY: {{ include "trackarr.stableSecret" (dict "ctx" $ "key" "ADMIN_API_KEY" "override" .Values.secrets.adminApiKey "len" 48) | quote }}
  IP_HASH_SECRET: {{ $ipHash | quote }}
  {{- if and .Values.metrics.enabled (not .Values.metrics.authToken) }}
  METRICS_AUTH_TOKEN: {{ include "trackarr.stableSecret" (dict "ctx" $ "key" "METRICS_AUTH_TOKEN" "override" "" "len" 48) | quote }}
  {{- else if .Values.metrics.authToken }}
  METRICS_AUTH_TOKEN: {{ .Values.metrics.authToken | quote }}
  {{- end }}
{{- end }}
