{{- if not .Values.config.existingConfigMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "trackarr.configMapName" . }}
  labels:
    {{- include "trackarr.labels" . | nindent 4 }}
  annotations:
    {{- include "trackarr.annotations" . | nindent 4 }}
data:
  NODE_ENV: "production"
  TZ: {{ .Values.site.timezone | quote }}

  # Handed to BitTorrent clients, so they must be the names clients resolve —
  # not in-cluster service names.
  NUXT_PUBLIC_TRACKER_HTTP_URL: {{ include "trackarr.trackerHttpUrl" . | quote }}
  NUXT_PUBLIC_TRACKER_UDP_URL: {{ include "trackarr.trackerUdpUrl" . | quote }}
  NUXT_PUBLIC_TRACKER_WS_URL: {{ include "trackarr.trackerWsUrl" . | quote }}

  # In-cluster, service to service.
  API_INTERNAL_URL: {{ printf "http://%s-api:%v" (include "trackarr.fullname" .) .Values.api.service.port | quote }}
  TRACKER_INTERNAL_URL: {{ printf "http://%s-tracker:%v" (include "trackarr.fullname" .) .Values.tracker.http.port | quote }}

  REDIS_KEY_PREFIX: {{ .Values.externalRedis.keyPrefix | default "ot:" | quote }}
{{- end }}
