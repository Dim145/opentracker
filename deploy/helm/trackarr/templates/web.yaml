{{- if .Values.web.enabled }}
{{- $c := "web" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trackarr.fullname" . }}-web
  labels:
    {{- include "trackarr.componentLabels" (dict "ctx" $ "component" $c) | nindent 4 }}
  annotations:
    {{- include "trackarr.annotations" . | nindent 4 }}
spec:
  {{- if not .Values.web.autoscaling.enabled }}
  replicas: {{ .Values.web.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "trackarr.componentSelectorLabels" (dict "ctx" $ "component" $c) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "trackarr.componentSelectorLabels" (dict "ctx" $ "component" $c) | nindent 8 }}
        {{- with .Values.web.podLabels }}{{ toYaml . | nindent 8 }}{{- end }}
      annotations:
        # Roll the pods when the rendered config changes; without this a
        # ConfigMap edit sits unread until something else triggers a restart.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.web.podAnnotations }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "trackarr.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "trackarr.podSecurityContext" . | nindent 8 }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.topologySpreadConstraints }}
      topologySpreadConstraints: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "trackarr.image" (dict "ctx" $ "image" .Values.web.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "trackarr.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.web.containerPort }}
              protocol: TCP
          envFrom:
            {{- include "trackarr.envFrom" . | nindent 12 }}
          env:
            - name: NITRO_PORT
              value: {{ .Values.web.containerPort | quote }}
            - name: NITRO_HOST
              value: "0.0.0.0"
            {{- with .Values.config.extraEnv }}{{ toYaml . | nindent 12 }}{{- end }}
            {{- with .Values.web.extraEnv }}{{ toYaml . | nindent 12 }}{{- end }}
          startupProbe:
            # `/` renders a full SSR page and 302s to /auth/login, which kubelet
            # follows and renders too. A cold render comfortably exceeds the
            # default 1 s timeout, so this needs a real one — measured failing
            # at 1 s on a test cluster.
            httpGet: { path: /, port: http }
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /, port: http }
            timeoutSeconds: 5
            periodSeconds: 15
          livenessProbe:
            # A socket check, not `/`: re-rendering the login page every 20 s to
            # ask whether the process is alive is pure waste, and a slow render
            # under load would restart a pod that is merely busy.
            tcpSocket: { port: http }
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            # readOnlyRootFilesystem, so anything that writes needs a mount.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "trackarr.fullname" . }}-web
  labels:
    {{- include "trackarr.componentLabels" (dict "ctx" $ "component" $c) | nindent 4 }}
  {{- with .Values.web.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.web.service.type }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "trackarr.componentSelectorLabels" (dict "ctx" $ "component" $c) | nindent 4 }}
{{- end }}
