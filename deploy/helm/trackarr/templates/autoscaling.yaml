{{- range $name, $cfg := dict "web" $.Values.web "api" $.Values.api "tracker" $.Values.tracker "relay" $.Values.relay }}
{{- if and $cfg.enabled $cfg.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "trackarr.fullname" $ }}-{{ $name }}
  labels:
    {{- include "trackarr.componentLabels" (dict "ctx" $ "component" $name) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "trackarr.fullname" $ }}-{{ $name }}
  minReplicas: {{ $cfg.autoscaling.minReplicas }}
  maxReplicas: {{ $cfg.autoscaling.maxReplicas }}
  metrics:
    {{- with $cfg.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ . }}
    {{- end }}
    {{- with $cfg.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ . }}
    {{- end }}
    {{- with $cfg.autoscaling.targetConnectionsPerPod }}
    # Held connections, not CPU. Ten thousand idle SSE readers cost almost
    # no CPU while filling a node completely, so a CPU-driven HPA never
    # fires and the node starts refusing instead of scaling. Needs the
    # custom metrics API (prometheus-adapter) exposing relay_connections.
    - type: Pods
      pods:
        metric:
          name: relay_connections
        target:
          type: AverageValue
          averageValue: {{ . | quote }}
    {{- end }}
{{- end }}
{{- end }}
