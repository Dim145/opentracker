{{- if .Values.networkPolicy.enabled }}
{{/*
Deny-by-default for the three app tiers, then allow only what the stack needs.
A cluster whose CNI does not implement NetworkPolicy accepts these objects and
ignores them silently, which is why this is off by default — a policy that does
nothing is worse than no policy, because it reads as protection.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "trackarr.fullname" . }}-default-deny
  labels:
    {{- include "trackarr.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "trackarr.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "trackarr.fullname" . }}-allow
  labels:
    {{- include "trackarr.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "trackarr.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # From the ingress controller, and from each other: the web SSR calls the
    # API, and the API calls the tracker over TRACKER_INTERNAL_URL.
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
      ports:
        - port: {{ .Values.web.containerPort }}
          protocol: TCP
        - port: {{ .Values.api.containerPort }}
          protocol: TCP
        - port: {{ .Values.tracker.http.port }}
          protocol: TCP
    {{- if .Values.tracker.udp.enabled }}
    # UDP announces arrive from the internet, not from a controller.
    - ports:
        - port: {{ .Values.tracker.udp.port }}
          protocol: UDP
    {{- end }}
{{- end }}
