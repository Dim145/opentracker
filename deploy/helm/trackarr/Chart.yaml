apiVersion: v2
name: trackarr
description: Trackarr — a private BitTorrent tracker (Nuxt SSR web, Nitro API, Go tracker)
type: application
home: https://github.com/Dim145/opentracker
sources:
  - https://github.com/Dim145/opentracker
version: 0.1.0
# Matches the application release this chart was validated against. Override
# the image tags in values.yaml to run a different one.
appVersion: "0.29.0"
kubeVersion: ">=1.27.0-0"
maintainers:
  - name: Dim145
    url: https://github.com/Dim145

# Dependencies are the projects' OWN charts, deliberately not Bitnami's:
#
#   - Postgres: CloudNativePG, the operator's own chart. `cluster` creates a
#     Cluster resource and, through `postgresql.poolers`, an operator-managed
#     PgBouncer that follows the primary across a failover on its own.
#   - Valkey: the Valkey project's own chart. There is no official Helm chart
#     for Redis OSS — helm.redis.io publishes Redis Enterprise, which is
#     commercial — and the Valkey chart exists precisely because of Bitnami's
#     2025 catalogue change. Valkey is protocol-compatible: ioredis, go-redis
#     and the tracker's Lua scripts run against it unchanged.
#
# Both are optional. Set `postgresql.enabled: false` / `valkey.enabled: false`
# and point `externalDatabase` / `externalRedis` at your own.
dependencies:
  - name: cluster
    alias: postgresql
    version: 0.8.1
    repository: https://cloudnative-pg.github.io/charts
    condition: postgresql.enabled

  # The CNPG OPERATOR, not the database. Cluster-scoped and it owns CRDs, so
  # one per cluster rather than one per release — leave this off and install it
  # once (see README). The flag exists for throwaway and CI clusters.
  - name: cloudnative-pg
    alias: postgresqlOperator
    version: 0.29.0
    repository: https://cloudnative-pg.github.io/charts
    condition: postgresqlOperator.enabled

  - name: valkey
    version: 0.11.0
    repository: https://valkey.io/valkey-helm
    condition: valkey.enabled
