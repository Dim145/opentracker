# PostgreSQL Client Authentication Configuration
# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Local connections (Unix domain socket)
local   all             all                                     scram-sha-256
# TCP loopback, which is how an operator debugs (docker exec ... psql -h
# 127.0.0.1). Missing, this file cut that path off the moment it was actually
# loaded -- see the hba_file note in docker-compose.prod.yml.
host    all             all             127.0.0.1/32            scram-sha-256

# IPv4 local connections (Docker network)
host    all             all             172.16.0.0/12           scram-sha-256
host    all             all             192.168.0.0/16          scram-sha-256
host    all             all             10.0.0.0/8              scram-sha-256

# IPv6 local connections
host    all             all             ::1/128                 scram-sha-256

# Reject all other connections
host    all             all             0.0.0.0/0               reject
host    all             all             ::/0                    reject
