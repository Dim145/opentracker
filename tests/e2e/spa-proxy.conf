# Caddy's stand-in for the static shape.
#
# The `front` image serves the SPA and nothing else — proxying /api, /announce
# and the rest is the reverse proxy's job in a real deployment, which is why
# `apps/web/docker/static/nginx.conf` says so at the top and does not do it.
#
# So the static shape is only testable behind something. This is the smallest
# something: the SPA on /, the API on /api, one origin, which is the arrangement
# the bundle assumes when it fetches /api/theme.css and /api/branding.
events {}

http {
  # nginx resolves upstreams once at startup by default, and compose starts these
  # in no guaranteed order. Naming the Docker DNS resolver and using a variable
  # defers the lookup to request time, so a slow API does not wedge the proxy
  # into a permanent "host not found" at boot.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 3000;

    location /api/ {
      set $upstream_api http://api:4000;
      proxy_pass $upstream_api$request_uri;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      set $upstream_spa http://spa:3000;
      proxy_pass $upstream_spa$request_uri;
      proxy_set_header Host $host;
    }
  }
}
