# Trackarr documentation — distroless nginx config.
#
# VitePress generates a fully static, multi-page site (one .html per
# .md plus a fingerprinted /assets/ tree). No SPA fallback is needed
# — every URL maps to a real file on disk. A request for an unknown
# route returns a real 404 carrying the 404.html VitePress emits, so
# the visitor keeps the site navigation instead of landing on nginx's
# built-in error page.

worker_processes auto;
pid /tmp/nginx.pid;

# This is a tiny static-asset host: a couple-hundred connections is
# plenty for any documentation traffic pattern.
events {
  worker_connections 256;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  access_log    /dev/stdout;
  error_log     /dev/stderr warn;

  sendfile         on;
  tcp_nopush       on;
  tcp_nodelay      on;
  keepalive_timeout 65;
  server_tokens    off;

  gzip              on;
  gzip_vary         on;
  gzip_min_length   1024;
  gzip_proxied      any;
  gzip_comp_level   6;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml
    font/woff2;

  # Default security headers. The CSP is intentionally tighter than
  # the application's because VitePress only embeds the data scripts
  # it generates itself — no runtime fetch beyond Google Fonts.
  #
  # add_header inheritance is all-or-nothing: a location declaring even
  # one add_header of its own drops this entire set, and `always` does
  # not change that. Every block below that sets its own Cache-Control
  # repeats this list verbatim — keep them in sync. /healthz declares
  # no add_header and inherits these as written.
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

  server {
    # 8080 because the Chainguard distroless nginx runs as a non-root
    # user and binding < 1024 would need CAP_NET_BIND_SERVICE.
    listen       8080 default_server;
    listen       [::]:8080 default_server;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Hand a miss to VitePress's own 404 page, which carries the site
    # navigation — nginx's built-in one is a dead end. The status stays
    # 404: error_page only swaps the body unless an `=code` override is
    # given, which is deliberately absent here. The target goes through
    # an internal redirect, so it re-enters the `\.html$` location and
    # picks up that block's no-store policy and security headers rather
    # than needing its own.
    #
    # Worth knowing: this also catches the `=404` from the asset blocks,
    # so a request for a renamed image now gets this HTML body instead
    # of nginx's terse page. The status is still 404, so nothing
    # mistakes it for content — only the body is bigger.
    error_page 404 /404.html;

    # VitePress fingerprints everything under /assets/. Long-cache the
    # whole tree — the URL changes whenever the content does.
    #
    # `^~` is load-bearing. As a plain prefix match nginx would only
    # *remember* this block and still go on to try the regex locations
    # below, where the extension regex matches every .js and .css in
    # here — so the fingerprinted bundle was served with that block's
    # 7d header instead of the year set here. `^~` ends matching for
    # anything under /assets/ before the regex phase runs.
    location ^~ /assets/ {
      # No `expires` alongside this: it emits its own bare
      # `Cache-Control: max-age=31536000`, so the response carried two
      # competing values and a client reading only the first lost
      # `immutable`. A max-age supersedes the Expires header that
      # `expires` set anyway (RFC 9111 5.3).
      add_header Cache-Control "public, max-age=31536000, immutable";
      # The add_header above drops every header inherited from the http
      # block — see the note there. Keep this list in sync with it.
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
      try_files  $uri =404;
    }

    # Other static asset extensions (favicons, images dropped into
    # /public, sitemaps, etc.) — week-long cache so a refresh isn't
    # cheap-but-not-free, but old files don't poison browsers if we
    # rename a logo.
    location ~* \.(?:ico|jpg|jpeg|png|gif|svg|webp|woff2?|ttf|eot|otf|css|js|json|map|txt|xml)$ {
      # See the /assets/ block: `expires` here duplicated Cache-Control.
      add_header Cache-Control "public, max-age=604800";
      # The add_header above drops every header inherited from the http
      # block — see the note there. Keep this list in sync with it.
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
      try_files  $uri =404;
    }

    # HTML pages: revalidate on every load so a deploy reaches every
    # browser without a hard reload. The Pages workflow rebuilds the
    # whole tree on each commit, so caching the rendered HTML beyond
    # the request just delays the new content.
    location ~* \.html$ {
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      # The add_header above drops every header inherited from the http
      # block — see the note there. Keep this list in sync with it.
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
      try_files  $uri =404;
    }

    # k8s / orchestrator readiness probe.
    location = /healthz {
      access_log   off;
      # `default_type`, not `add_header Content-Type`: add_header only
      # appends, so this used to answer with two Content-Type headers
      # (application/octet-stream from the http default, then
      # text/plain). Declaring no add_header here also keeps this block
      # on the inherited security headers.
      default_type text/plain;
      return       200 'ok';
    }

    # Default catch-all. Three try_files arms cover the VitePress
    # output shapes:
    #   - $uri           → exact file (e.g. /assets/app.123.js)
    #   - $uri.html      → page lookup without extension; lets a
    #                      visitor / external link to
    #                      `/guide/getting-started` resolve to
    #                      `/guide/getting-started.html` even though
    #                      VitePress's own client-side links carry
    #                      the .html extension explicitly
    #   - $uri/index.html → directory index for routes built into a
    #                      folder by `cleanUrls: true`
    #
    # We deliberately do NOT fall back to /index.html on a miss — a
    # visitor should get a real 404, not the homepage under a random
    # URL. The `=404` below is picked up by the server's `error_page`,
    # which answers it with VitePress's 404.html at status 404.
    location / {
      # Clean URLs are answered from here, not by the `\.html$` block
      # above: in a try_files ending with `=404` only the last arm
      # redirects internally, so an earlier arm that matches serves the
      # file in this context and never re-runs location matching.
      # Without the header below `/guide/getting-started` came back
      # with no Cache-Control at all while `/guide/getting-started.html`
      # — the very same page — came back `no-store`. The clean form is
      # the one VitePress links and external sites point at, so it was
      # the form most likely to be served stale from a browser's
      # heuristic cache after a deploy.
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      # The add_header above drops every header inherited from the http
      # block — see the note there. Keep this list in sync with it.
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
      try_files $uri $uri.html $uri/index.html =404;
    }
  }
}
