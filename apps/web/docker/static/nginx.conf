# Trackarr static frontend — served as an SPA from /usr/share/nginx/html.
#
# Routing: this container is purely a static asset host. It does NOT
# proxy /api/*, /announce* or anything else upstream — that's the job
# of Caddy (or whatever reverse proxy you already have in front of the
# stack). Pointing Caddy's `/*` at this container instead of the SSR
# `web:3000` is the only change needed to switch to the static path.
#
# Runtime config: the SPA fetches /api/runtime-config on boot and
# patches its useRuntimeConfig() values from there, so the same image
# is portable across domains. See apps/web/plugins/runtime-config.
# client.ts.

worker_processes auto;
pid /tmp/nginx.pid;

# Tiny by design. We're a static asset host, not a busy backend.
events {
  worker_connections 256;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Logs to stdout/stderr so docker logs / k8s logs see them.
  access_log    /dev/stdout;
  error_log     /dev/stderr warn;

  # Performance basics.
  sendfile         on;
  tcp_nopush       on;
  tcp_nodelay      on;
  keepalive_timeout 65;
  server_tokens    off;

  # Gzip everything compressible. brotli would be nicer but isn't
  # built into the Chainguard nginx image.
  gzip              on;
  gzip_vary         on;
  gzip_min_length   1024;
  gzip_proxied      any;
  gzip_comp_level   6;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml
    font/woff2;

  # Distroless nginx writes its scratch files under /var/cache and
  # /var/run; the unprivileged build of nginx (Chainguard) configures
  # these for us. We just need to confirm the html dir is readable.

  # Default security headers applied on every response. Caddy in
  # front sets HSTS / CSP, so this is mostly a defense-in-depth layer
  # for setups where Caddy is bypassed (direct nginx exposure).
  #
  # "Every response" needs help to stay true: add_header inheritance is
  # all-or-nothing. A location declaring even one add_header of its own
  # drops the whole set inherited from here, and `always` does not
  # change that. Every block below that sets its own Cache-Control
  # therefore repeats this list verbatim — keep them in sync. Blocks
  # that declare no add_header (the payload guard, /healthz, the SPA
  # fallback) inherit these as written.
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
  # No third-party origin: `@nuxt/fonts` downloads Inter, JetBrains Mono and
  # Fraunces at build time and this image serves them from `/_fonts/`, so
  # `'self'` covers the faces as well as the stylesheet. Keep it that way — the
  # point of self-hosting was that a visitor's IP never reaches a font CDN.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

  server {
    # Listen on the same port the SSR container uses so the existing
    # Caddy upstream (web:3000) doesn't need a config change to switch
    # between the two builds.
    listen       3000 default_server;
    listen       [::]:3000 default_server;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Long cache for hashed Nuxt build assets. Nuxt fingerprints
    # filenames in /_nuxt/ so we can be aggressive here.
    #
    # `^~` is load-bearing here, not decoration. As a plain prefix match
    # nginx would only *remember* this block and still go on to try the
    # regex locations below — and the extension regex matches every
    # hashed chunk in here, so the entire bundle was being served with
    # that block's 7d header instead of the year set just below. `^~`
    # ends location matching for anything under /_nuxt/ before the
    # regex phase runs.
    location ^~ /_nuxt/ {
      # No `expires` alongside this: it emits its own bare
      # `Cache-Control: max-age=31536000`, so the response carried two
      # competing values and a client reading only the first lost
      # `immutable` — the whole point of the block. A max-age also
      # supersedes the Expires header that `expires` set (RFC 9111 5.3).
      add_header Cache-Control "public, max-age=31536000, immutable";
      # The add_header above drops every header inherited from the http
      # block — see the note there. Keep this list in sync with it.
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
      try_files  $uri =404;
    }

    # Self-hosted font faces (`@nuxt/fonts`). Content-addressed filenames, so
    # they are as immutable as the bundle — a returning visitor should never
    # revalidate them.
    #
    # `^~` and not a plain prefix, deliberately: nginx lets a matching regex
    # location beat a remembered prefix, and the `\.woff2?$` block further down
    # would otherwise capture these and hand back 7 days instead of a year.
    location ^~ /_fonts/ {
      # `add_header` here drops EVERY header inherited from the http block —
      # nginx's inheritance is all-or-nothing — so the whole set is repeated.
      # Keep it in sync with the http block above. Omitting it is how this file
      # came to declare a policy it never sent; see the note there.
      #
      # One `Cache-Control`, not `expires` plus an `add_header`: the pair emits
      # the header twice and browsers are entitled to take either.
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
      try_files  $uri =404;
    }

    # Nuxt's hydration payload files (`_payload.json`, `_payload.js`).
    # These ONLY exist for routes that were pre-rendered at build
    # time. With `ssr: false` only `/` is pre-rendered, so any deep
    # link that hard-reloads (e.g. `/torrents`) requests a payload
    # that's not on disk. Without this block the request would tumble
    # into the SPA fallback below and serve index.html with status
    # 200 — Nuxt's client then tries to parse the HTML as JSON and
    # stalls the entire boot silently. A clean 404 lets Nuxt skip
    # the payload and finish hydrating from the SPA shell.
    location ~ /_payload\.(?:json|js)$ {
      try_files $uri =404;
    }

    # Other static assets (favicons, images uploaded into /public,
    # source maps, JSON manifests). `.json` and `.map` were missing
    # from this list — same trap as the payload above: any *.json
    # request that didn't hit a real file used to fall through to
    # `/index.html`, which would 200 with HTML and break the JSON
    # parser on the other end.
    location ~* \.(?:ico|jpg|jpeg|png|gif|svg|webp|woff2?|ttf|eot|otf|css|js|json|map|txt|xml)$ {
      # See the /_nuxt/ block: `expires` here duplicated Cache-Control.
      add_header Cache-Control "public, max-age=604800";
      # The add_header above drops every header inherited from the http
      # block — see the note there. Keep this list in sync with it.
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
      try_files  $uri =404;
    }

    # Force-revalidate the entry document so a deploy lands on every
    # browser without a hard reload.
    location = /index.html {
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      # The add_header above drops every header inherited from the http
      # block — see the note there. Keep this list in sync with it.
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
      try_files  $uri =404;
    }

    # Health probe — useful for k8s readiness.
    location = /healthz {
      access_log   off;
      # `default_type`, not `add_header Content-Type`: add_header only
      # appends, so this used to answer with two Content-Type headers
      # (application/octet-stream from the http default, then
      # text/plain). Declaring no add_header here also keeps this block
      # on the inherited security headers.
      default_type text/plain;
      return       200 'ok';
    }

    # SPA fallback — let vue-router / nuxt page routing handle deep
    # links by always returning index.html when no asset matches.
    #
    # Notice: no `$uri/` in try_files. With it, an URL like
    # `/search?v=grouped` would resolve to a real `/search/` directory
    # if one survived from an older build (Nitro's default
    # `crawlLinks: true` used to emit per-route HTML folders) and
    # nginx would emit a 301 redirect to `/search/` — losing the
    # query string for clients that don't preserve it across the
    # redirect, and causing the "weird 301 on a SPA route" log entry
    # we kept seeing in production.
    #
    # Skipping the directory probe means nginx routes every unknown
    # path directly to /index.html with the original 200 status.
    # Real assets (images, etc.) still match earlier `location` blocks
    # by extension, so this only changes behaviour for genuine SPA
    # routes.
    location / {
      try_files $uri /index.html;
    }
  }
}
