# Builds, signs and pushes the five images.
#
# Three entry points, deliberately:
#
#   workflow_call     — how release-tag.yml drives this after it creates the
#                       tag. This is the primary path and it exists because
#                       the `release: published` trigger below CANNOT fire for
#                       an automated release: action-gh-release authenticates
#                       with the default GITHUB_TOKEN, and GitHub does not
#                       raise workflow-triggering events for anything done
#                       with that token (the recursion guard). Releases cut by
#                       the pipeline therefore built nothing at all until
#                       someone re-published them by hand. Do not "simplify"
#                       this back into a bare release trigger.
#   release           — still honoured, so a Release published manually by a
#                       human (which does propagate) keeps working.
#   workflow_dispatch — escape hatch to rebuild an existing tag without
#                       touching the Release.
#
# Every path resolves to the same `version`, and the tag set is pinned
# explicitly rather than inferred from the event: under workflow_call the ref
# is the merge commit, so metadata-action's defaults would derive a branch
# name instead of the release version. `<version>` + `latest` is exactly what
# the release event produced before, and the compose files default to
# IMAGE_TAG=latest, so that rolling tag has to keep moving.
name: publish basic container

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      version:
        description: Release version to build, tag and push (e.g. 0.23.0)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Existing tag to rebuild and push (e.g. 0.23.0)
        required: true
        type: string

permissions:
  contents: read

# Do not pile up parallel runs when several releases are published back to
# back — the second cancels the first.
# Keyed on the version, not on github.ref: under workflow_call the ref is the
# caller's, so two different releases would share a group and the second would
# cancel the first mid-push.
concurrency:
  group: docker-publish-${{ inputs.version || github.event.release.tag_name }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ${{ github.repository }}
  # `inputs` is null on the release event, so this collapses to the tag name
  # there and to the caller-supplied value on workflow_call / dispatch.
  VERSION: ${{ inputs.version || github.event.release.tag_name }}

jobs:
  # Backend and frontend run in parallel — no dependency between them,
  # aucune raison de payer la latence d'un build séquentiel.
  build-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      # Build the tag, not whatever ref the trigger happened to carry — under
      # workflow_call that ref is the release PR's merge commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VERSION }}
          # Build-only checkout: no push, so the token has no business
          # surviving in .git/config for the rest of the job.
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.2.4'

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (api)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/api
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest

      - name: Build and push api image
        id: build-and-push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./
          file: ./apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64

      - name: Sign the api image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes "{}@${DIGEST}"


  build-tracker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      # Build the tag, not whatever ref the trigger happened to carry — under
      # workflow_call that ref is the release PR's merge commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VERSION }}
          # Build-only checkout: no push, so the token has no business
          # surviving in .git/config for the rest of the job.
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.2.4'

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tracker)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/tracker
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest

      - name: Build and push tracker image
        id: build-and-push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./
          file: ./apps/tracker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64

      - name: Sign the tracker image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes "{}@${DIGEST}"


  build-front-ssr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      # Build the tag, not whatever ref the trigger happened to carry — under
      # workflow_call that ref is the release PR's merge commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VERSION }}
          # Build-only checkout: no push, so the token has no business
          # surviving in .git/config for the rest of the job.
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.2.4'

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (front-ssr)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/front-ssr
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest

      - name: Build and push front-ssr image
        id: build-and-push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./
          file: ./apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64

      - name: Sign the front-ssr image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes "{}@${DIGEST}"

  build-front:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      # Build the tag, not whatever ref the trigger happened to carry — under
      # workflow_call that ref is the release PR's merge commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VERSION }}
          # Build-only checkout: no push, so the token has no business
          # surviving in .git/config for the rest of the job.
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.2.4'

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (front)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/front
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest

      - name: Build and push front image
        id: build-and-push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./
          file: ./apps/web/Dockerfile.static
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64

      - name: Sign the front image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes "{}@${DIGEST}"

  # Documentation site (VitePress static + distroless nginx).
  # Self-contained npm project under ./doc — context scoped there
  # so the build doesn't drag the rest of the monorepo into the
  # builder layer.
  build-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      # Build the tag, not whatever ref the trigger happened to carry — under
      # workflow_call that ref is the release PR's merge commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VERSION }}
          # Build-only checkout: no push, so the token has no business
          # surviving in .git/config for the rest of the job.
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.2.4'

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (docs)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/docs
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest

      - name: Build and push docs image
        id: build-and-push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          # The doc bundle is a self-contained npm project; scope
          # the build context to ./doc so the COPY in Dockerfile
          # resolves locally and we don't ship pnpm workspace
          # overhead into the builder layer.
          context: ./doc
          file: ./doc/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          # Default base path is `/`, matching the standalone
          # docker-run usage. The GitHub Pages deploy
          # (deploy-docs.yml) keeps its own `/opentracker/` base
          # via the VitePress config fallback.
          build-args: |
            VITEPRESS_BASE=/

      - name: Sign the docs image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes "{}@${DIGEST}"

  # Post-condition: a tag must never exist without five images behind it.
  #
  # The build jobs above going green is not the same claim — they can succeed
  # while an image is pushed under the wrong tag, which is precisely the class
  # of mistake the explicit `tags:` above exists to prevent. This asks the
  # registry instead of trusting the build, and it is what makes a broken
  # release fail the release run rather than surface weeks later as a stale
  # `latest`.
  verify:
    name: verify images are in the registry
    needs: [build-api, build-tracker, build-front-ssr, build-front, build-docs]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Every image must resolve at ${{ env.VERSION }} and at latest
        run: |
          set -euo pipefail
          # github.repository keeps the owner's casing (Dim145/…) but ghcr
          # paths are lowercase. metadata-action normalises this for the build
          # jobs; here the ref is assembled by hand, so it has to be done
          # explicitly or every lookup 404s.
          base=$(printf '%s' "$IMAGE_BASE" | tr '[:upper:]' '[:lower:]')
          missing=0
          for image in api tracker front-ssr front docs; do
            for tag in "${VERSION}" latest; do
              ref="${REGISTRY}/${base}/${image}:${tag}"
              if digest=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}' 2>/dev/null); then
                echo "  ok      $ref -> $digest"
              else
                echo "::error::image missing from the registry: $ref"
                missing=1
              fi
            done
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::release ${VERSION} is incomplete — do not announce it"
            exit 1
          fi
