# Deploy VitePress documentation to GitHub Pages
name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'doc/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: false

# Nothing beyond reading the repository is granted workflow-wide: the Pages
# write scope and the OIDC token live on the single job that needs each of
# them. A workflow-level `id-token: write` let the build job — the one that
# runs `npm ci` on third-party code — mint provenance tokens it has no use
# for.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # `configure-pages` reads the Pages configuration through the API.
    # No `id-token` here: the build produces an artifact, it never deploys.
    permissions:
      contents: read
      pages: write
    defaults:
      run:
        working-directory: ./doc
    
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Nothing here pushes; leaving the token in .git/config only
          # widens what a compromised build step could exfiltrate.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 24, comme `doc/Dockerfile` et comme les autres workflows.
          # Ce travail était resté sur 20, en fin de vie depuis avril 2026 :
          # la même documentation était donc construite sur deux runtimes,
          # et le déploiement — qui a `pages: write` — tournait sur celui
          # qui ne reçoit plus de correctif. Vérifié : `npm ci` puis
          # `npm run build` passent en 24 (vitepress 1.6.4 demande >= 20).
          node-version: 24
          cache: 'npm'
          cache-dependency-path: './doc/package-lock.json'

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install dependencies
        run: npm ci

      - name: Build documentation
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: doc/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # `deploy-pages` publishes the artifact and attests its origin, which
    # is what actually needs the Pages scope and the OIDC token.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
