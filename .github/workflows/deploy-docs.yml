# Deploy VitePress documentation to GitHub Pages
name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'doc/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: false

# Nothing beyond reading the repository is granted workflow-wide: the Pages
# write scope and the OIDC token live on the single job that needs each of
# them. A workflow-level `id-token: write` let the build job — the one that
# runs `npm ci` on third-party code — mint provenance tokens it has no use
# for.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # `configure-pages` reads the Pages configuration through the API.
    # No `id-token` here: the build produces an artifact, it never deploys.
    permissions:
      contents: read
      pages: write
    defaults:
      run:
        working-directory: ./doc
    
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          # Nothing here pushes; leaving the token in .git/config only
          # widens what a compromised build step could exfiltrate.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './doc/package-lock.json'

      - name: Setup Pages
        uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d # v4

      - name: Install dependencies
        run: npm ci

      - name: Build documentation
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: doc/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # `deploy-pages` publishes the artifact and attests its origin, which
    # is what actually needs the Pages scope and the OIDC token.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
