# Auto-tag on Release PR Merge
# This workflow creates a git tag when a release/* branch is merged to main

name: Create Release Tag

on:
    pull_request:
        types: [closed]
        branches: [main]

# Read-only by default. `create-tag` raises itself to `contents: write`
# because it pushes a tag, cuts a Release and deletes the release branch;
# `publish-images` declares its own scopes further down. Granting the write
# workflow-wide handed it to every job, present and future.
permissions:
    contents: read

jobs:
    create-tag:
        # Only run if PR was merged (not just closed) and branch starts with release/
        if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
        runs-on: ubuntu-latest

        # Pushes the tag, creates the Release, deletes the release branch.
        permissions:
            contents: write

        outputs:
            version: ${{ steps.version.outputs.version }}
            created: ${{ steps.check_tag.outputs.exists == 'false' }}

        steps:
            # The one checkout in this repository that KEEPS its credentials,
            # because the job's whole purpose is to push a tag and cut a
            # Release with them. zizmor flags credential persistence
            # (`artipacked`) on the grounds that a later step can capture
            # `.git/config` into an artifact — this job uploads nothing, runs
            # no third-party action after the checkout, and is gated on a
            # release/* branch having been merged by someone with write access.
            # Recorded as a decision rather than left as an unexplained warning.
            - name: Checkout
              # zizmor: ignore[artipacked]
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  fetch-depth: 0

            # HEAD_REF goes through the environment rather than being
            # interpolated into the script: a branch name is attacker-chosen
            # text, and `${{ }}` would splice it into the shell before bash
            # ever sees it.
            - name: Extract version from branch name
              id: version
              env:
                  HEAD_REF: ${{ github.event.pull_request.head.ref }}
              run: |
                  set -euo pipefail
                  VERSION="${HEAD_REF#release/}"
                  # Two checks, because neither is sufficient alone and this
                  # value gets spliced into `git tag`, into $GITHUB_OUTPUT and
                  # into the published image tags:
                  #
                  #   - the `case` rejects any byte outside [0-9.], which is
                  #     what stops an embedded newline turning one output into
                  #     two ("version=0.1.0\nversion=injected");
                  #   - grep is line-oriented, so its anchors only bind within
                  #     a line — but with newlines already excluded it now
                  #     enforces the three-component shape on the whole string.
                  #
                  # A `case` glob alone is not enough either: `[0-9]*.[0-9]*.[0-9]*`
                  # happily matches "0.0.0; curl evil.example.com".
                  case "$VERSION" in
                      ''|*[!0-9.]*)
                          echo "::error::branch '$HEAD_REF' does not name a release version"
                          exit 1
                          ;;
                  esac
                  if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                      echo "::error::branch '$HEAD_REF' does not name a release version"
                      exit 1
                  fi
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "Extracted version: $VERSION"

            - name: Check if tag exists
              id: check_tag
              run: |
                  # Quoted: `$GITHUB_OUTPUT` is a path, and an unquoted one
                  # word-splits on any space in the runner's temp directory.
                  # SC2086 flagged it, and the workflow that creates release
                  # tags is not the place to leave a redirection target to
                  # chance.
                  if git rev-parse "${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
                    echo "exists=true" >> "$GITHUB_OUTPUT"
                    echo "Tag ${{ steps.version.outputs.version }} already exists"
                  else
                    echo "exists=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Create and push tag
              if: steps.check_tag.outputs.exists == 'false'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git tag -a "${{ steps.version.outputs.version }}" -m "Release ${{ steps.version.outputs.version }}"
                  git push origin "${{ steps.version.outputs.version }}"
                  echo "✅ Created tag: ${{ steps.version.outputs.version }}"

            - name: Create GitHub Release
              if: steps.check_tag.outputs.exists == 'false'
              # v1 runs on a Node runtime GitHub no longer supports.
              uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
              with:
                  tag_name: ${{ steps.version.outputs.version }}
                  name: Release ${{ steps.version.outputs.version }}
                  body: ${{ github.event.pull_request.body }}
                  generate_release_notes: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Delete release branch
              env:
                  HEAD_REF: ${{ github.event.pull_request.head.ref }}
              run: |
                  git push origin --delete "$HEAD_REF" || true
                  echo "🧹 Cleaned up branch: $HEAD_REF"

    # Build and push the images by calling docker.yml directly.
    #
    # This is NOT redundant with docker.yml's own `release: published` trigger.
    # The Release above is created by action-gh-release using the default
    # GITHUB_TOKEN, and GitHub does not raise workflow-triggering events for
    # anything done with that token — the recursion guard. So the release event
    # never reaches docker.yml, and before this job existed every automated
    # release produced a tag and a Release with no images behind them; 0.23.0
    # only got built because someone toggled the Release draft -> published by
    # hand with a user token. Calling the workflow removes the dependency on
    # event propagation entirely, rather than working around it with a PAT.
    publish-images:
        needs: create-tag
        if: needs.create-tag.outputs.created == 'true'
        uses: ./.github/workflows/docker.yml
        with:
            version: ${{ needs.create-tag.outputs.version }}
        # docker.yml pushes to ghcr and signs with cosign; a called workflow can
        # never hold more than the caller grants it.
        permissions:
            contents: read
            packages: write
            id-token: write
        # No `secrets: inherit`. The called workflow only ever reads
        # `secrets.GITHUB_TOKEN`, which GitHub provides to a reusable workflow
        # automatically, scoped by the `permissions` block above. Inheriting
        # handed it every secret in the repository — including any unrelated
        # to publishing images.
