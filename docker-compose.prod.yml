# Production Docker Compose Configuration
# Three application containers (web/api/tracker) + Caddy + PgBouncer + Postgres + Redis.

# ── Secrets obligatoires ─────────────────────────────────────────────────────
# `${VAR:-défaut}` substitue le défaut quand la variable est VIDE autant
# qu'absente. `.env.example` promettait « leave empty and let the stack refuse
# to start rather than ship a guessable default » ; avec `DB_PASSWORD=` la pile
# démarrait sur `postgres://tracker:tracker@…`. Mesuré via `docker compose
# config`.
#
# `${VAR:?message}` fait avorter `docker compose up` en nommant la variable, ce
# qui rend la promesse vraie.
#
# Redis avait la même faille, avec une issue plus retorse : l'argument vide
# disparaissait de la ligne de commande et `--requirepass` avalait
# `--maxmemory` comme argument, ce qui faisait échouer le démarrage — donc une
# panne fermée par ACCIDENT. Déplacer l'option voisine, ou en mettre une sans
# argument, et Redis aurait démarré avec le mot de passe littéral
# « --maxmemory » et SANS plafond mémoire.

services:
  # =============================================================================
  # REVERSE PROXY - Caddy with automatic HTTPS
  # =============================================================================
  caddy:
    # Pinned rather than floating on 2-alpine: a rescheduled container should
    # not pull a different Caddy than the one the TLS setup was verified on.
    image: caddy:2.11.4-alpine
    container_name: trackarr-caddy
    restart: always
    # Caddy already runs from a tight image; lock the rootfs and only
    # expose its three persistent directories as named volumes.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      # Required to bind the privileged ports 80 / 443.
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      TRACKER_DOMAIN: ${TRACKER_DOMAIN:-tracker.localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    networks:
      - trackarr-public
      - trackarr-internal
    depends_on:
      # Forme longue, comme api/tracker/relay dans ce même fichier. La forme
      # courte n'attend que le DÉMARRAGE, ce qui est en réalité le bon choix
      # ici — Caddy répond 502 en attendant et se rétablit tout seul, alors
      # qu'attendre la santé retarderait la mise à disposition du site pour
      # rien. L'écrire explicitement plutôt que par omission : dans un fichier
      # où trois services voisins déclarent `service_healthy`, la forme courte
      # se lit comme un oubli.
      web:
        condition: service_started
      api:
        condition: service_started
      tracker:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256M
          # pids lives inside deploy.resources.limits because the
          # compose spec rejects setting both `pids_limit` and the
          # nested form on the same service when a `deploy:` block
          # already exists.
          pids: 100
        reservations:
          memory: 64M

  # =============================================================================
  # WEB - Nuxt SSR frontend
  # =============================================================================
  web:
    image: ghcr.io/dim145/opentracker/front-ssr:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: trackarr-web
    restart: always
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      # SSR fetches need to reach the API container internally
      API_INTERNAL_URL: http://api:4000
      # Tracker URLs displayed to users (read at runtime by Nuxt)
      NUXT_PUBLIC_TRACKER_HTTP_URL: ${NUXT_PUBLIC_TRACKER_HTTP_URL:-https://localhost/announce}
      NUXT_PUBLIC_TRACKER_UDP_URL: ${NUXT_PUBLIC_TRACKER_UDP_URL:-udp://localhost:6969/announce}
      NUXT_PUBLIC_TRACKER_WS_URL: ${NUXT_PUBLIC_TRACKER_WS_URL:-ws://localhost:8082}
    expose:
      - "3000"
    networks:
      - trackarr-public
      - trackarr-internal
    depends_on:
      - api
    deploy:
      resources:
        limits:
          # Must exceed --max-old-space-size (384M, set in apps/web/Dockerfile)
          # plus V8 isolate / SSR scratch overhead (~100–150 MB).
          memory: 512M
          pids: 200
        reservations:
          memory: 96M
    # Healthcheck is defined in apps/web/Dockerfile (Node-based, no shell needed
    # because the runtime image is distroless). Compose inherits it.

  # =============================================================================
  # API - Nitro standalone (all /api/* routes)
  # =============================================================================
  api:
    image: ghcr.io/dim145/opentracker/api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: trackarr-api
    restart: always
    read_only: true
    tmpfs:
      # esbuild (used by drizzle-kit's boot-time `push`) writes its
      # transpiled bundle to $TMPDIR. Without this mount the schema push
      # would fail with EROFS on first boot.
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ:-Europe/Paris}
      NODE_ENV: production
      NITRO_PORT: 4000
      NITRO_HOST: 0.0.0.0
      # Database (through PgBouncer at runtime)
      DATABASE_URL: postgres://${DB_USER:-tracker}:${DB_PASSWORD:?DB_PASSWORD must be set in .env — see .env.example}@pgbouncer:6432/${DB_NAME:-trackarr}?sslmode=disable
      MIGRATIONS_DATABASE_URL: postgres://${DB_USER:-tracker}:${DB_PASSWORD:?DB_PASSWORD must be set in .env — see .env.example}@postgres:5432/${DB_NAME:-trackarr}?sslmode=disable
      DB_SSL: "false"
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      # Redis
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Auth/session secrets
      NUXT_SESSION_SECRET: ${NUXT_SESSION_SECRET}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      IP_HASH_SECRET: ${IP_HASH_SECRET}
      # Messaging. The URL is what the browser is told to connect to, so it
      # is the public path through Caddy, not the container name. Leave the
      # secret unset and the messaging pages fall back to polling instead
      # of failing — the feature degrades, it does not break.
      MESSAGING_SERVICE_URL: ${MESSAGING_SERVICE_URL:-/messaging}
      MESSAGING_TOKEN_SECRET: ${MESSAGING_TOKEN_SECRET}
      # Caddy is in front — trust proxy headers for real client IPs
      TRUST_PROXY: "true"
      # Uploads: filesystem by default, into the volume mounted below.
      #
      # STORAGE_DRIVER=s3 sends them to an S3-compatible object store instead
      # (AWS, MinIO, RustFS, Ceph, Garage, R2) and the volume stops being
      # needed — which is what lets you run more than one API replica without a
      # shared mount. See doc/guide/object-storage.md.
      #
      # Every S3_* credential also accepts a Docker secret through the matching
      # *_FILE variable, e.g. S3_SECRET_ACCESS_KEY_FILE=/run/secrets/s3_secret.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-fs}
      UPLOADS_DIR: /app/data/uploads
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PREFIX: ${S3_PREFIX:-}
      # true for MinIO / RustFS / Ceph RGW; false for AWS.
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_CREATE_BUCKET: ${S3_CREATE_BUCKET:-false}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      # Tracker URLs are also exposed by the API for endpoints like
      # GET /api/torrents/[hash]/download (announce embedded in .torrent files).
      NUXT_PUBLIC_TRACKER_HTTP_URL: ${NUXT_PUBLIC_TRACKER_HTTP_URL:-https://localhost/announce}
      NUXT_PUBLIC_TRACKER_UDP_URL: ${NUXT_PUBLIC_TRACKER_UDP_URL:-udp://localhost:6969/announce}
      NUXT_PUBLIC_TRACKER_WS_URL: ${NUXT_PUBLIC_TRACKER_WS_URL:-ws://localhost:8082}
      # Reached over the internal compose network for /api/tracker-health
      # probes. Override only if the tracker lives outside this stack.
      TRACKER_INTERNAL_URL: ${TRACKER_INTERNAL_URL:-http://tracker:8080}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      IGDB_ID: ${IGDB_ID:-}
      IGDB_SECRET: ${IGDB_SECRET:-}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
    expose:
      - "4000"
    volumes:
      - uploads_data:/app/data/uploads
    networks:
      - trackarr-public
      - trackarr-internal
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # Must exceed --max-old-space-size (512M, set in apps/api/Dockerfile)
          # plus V8 isolate / native module overhead (~150–200 MB).
          memory: 768M
          pids: 200
        reservations:
          memory: 96M
    # Healthcheck is defined in apps/api/Dockerfile (Node-based, no shell needed
    # because the runtime image is distroless). Compose inherits it.

  # =============================================================================
  # TRACKER - BitTorrent HTTP tracker (standalone)
  # =============================================================================
  tracker:
    image: ghcr.io/dim145/opentracker/tracker:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/tracker/Dockerfile
    container_name: trackarr-tracker
    restart: always
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${DB_USER:-tracker}:${DB_PASSWORD:?DB_PASSWORD must be set in .env — see .env.example}@pgbouncer:6432/${DB_NAME:-trackarr}?sslmode=disable
      DB_SSL: "false"
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      IP_HASH_SECRET: ${IP_HASH_SECRET}
      TRACKER_HTTP_PORT: 8080
      # UDP frontend (BEP 15). UDP can't be reverse-proxied by Caddy
      # so it's exposed directly on the host via `ports` below.
      TRACKER_UDP_PORT: 6969
      TRACKER_UDP_ENABLED: ${TRACKER_UDP_ENABLED:-false}
      TRACKER_DEBUG: ${TRACKER_DEBUG:-false}
      # Caddy proxies BitTorrent announces on `/announce` and on the
      # `tracker.*` subdomain. Without trusting its X-Real-IP /
      # X-Forwarded-For headers every peer ends up registered with
      # Caddy's container IP and clients can't reach each other.
      TRUST_PROXY: "true"
    expose:
      - "8080"
    ports:
      - "6969:6969/udp"
    networks:
      # `trackarr-public` retiré : le tracker ne parle qu'à Postgres et à
      # Redis — c'est écrit dans son propre Dockerfile, qui n'embarque même
      # pas de bundle CA pour cette raison. Aucun port n'était publié, donc il
      # n'y avait pas de surface entrante ; ce que cela retire est un accès
      # sortant vers l'internet dont il n'a pas l'usage, et donc la portée
      # d'une compromission. Le port UDP 6969 publié fonctionne
      # indépendamment du réseau attaché.
      - trackarr-internal
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          pids: 100
        reservations:
          memory: 128M

  # =============================================================================
  # MESSAGING RELAY - Go, SSE fan-out only
  # =============================================================================
  # One node here. The count is a deployment choice, not a code one: the
  # node registers itself in Valkey and the API sends every registered node
  # the limits to apply, so `--scale relay=3` needs no configuration change.
  relay:
    image: ghcr.io/dim145/opentracker/relay:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/relay/Dockerfile
    restart: always
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Shared with the API, which mints the tokens this verifies. The two
      # must match or every connection is rejected as forged.
      MESSAGING_TOKEN_SECRET: ${MESSAGING_TOKEN_SECRET}
      RELAY_ADDR: ":4100"
      # Same-origin through Caddy, so no CORS grant is needed. Set this
      # only if the relay is served from another hostname.
      RELAY_ALLOW_ORIGIN: ${RELAY_ALLOW_ORIGIN:-}
    expose:
      - "4100"
    networks:
      - trackarr-internal
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # A connection costs a bounded queue and little else; this holds
          # far more than one node is told to accept.
          memory: 256M
          pids: 200
        reservations:
          memory: 64M

  # =============================================================================
  # DATABASE - PostgreSQL
  # =============================================================================
  postgres:
    # PostgreSQL 18. NOT an in-place bump from 16: the server refuses a data
    # directory written by an older major ("database files are incompatible
    # with server"). Follow doc/guide/upgrading.md before pulling this.
    image: postgres:18.6-alpine
    container_name: trackarr-db
    restart: always
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${DB_USER:-tracker}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env — see .env.example}
      POSTGRES_DB: ${DB_NAME:-trackarr}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      # REQUIRED from 18 on. The official image moved its default PGDATA to
      # /var/lib/postgresql/<major>/docker; setting it back keeps the volume
      # layout this stack has always used, so the mount below stays correct
      # and an upgraded cluster is found where it already lives.
      PGDATA: /var/lib/postgresql/data
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./docker/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    # `-c hba_file` : le fichier monté juste au-dessus, RÉELLEMENT chargé.
    #
    # Il était monté en lecture seule et jamais lu — sans cette option Postgres
    # utilise `/var/lib/postgresql/data/pg_hba.conf`, celui que l'image génère.
    # Mesuré dans un conteneur au même montage, les règles effectives étaient
    # `local all all trust` et `host all all 127.0.0.1 trust`, exactement ce que
    # le fichier du dépôt cherchait à interdire : tout ce qui atteint l'espace de
    # noms du conteneur était superutilisateur sans mot de passe. Le montage
    # donnait l'apparence d'un contrôle qui n'existait pas.
    #
    # (La note vit ici et non dans le bloc ci-dessous : un scalaire replié YAML
    # n'a pas de commentaires, il aurait pris ces lignes pour des arguments.)
    command: >
      postgres
      -c hba_file=/etc/postgresql/pg_hba.conf
      -c ssl=off
      -c log_connections=on
      -c log_disconnections=on
      -c log_statement=ddl
      -c log_min_duration_statement=1000
      -c max_connections=200
      -c shared_buffers=512MB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c effective_cache_size=1536MB
      -c random_page_cost=1.1
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${DB_USER:-tracker} -d ${DB_NAME:-trackarr}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - trackarr-internal
    deploy:
      resources:
        limits:
          memory: 2G
          # Le seul service sans plafond de processus, alors que les six autres
          # en ont un. Postgres fork un processus par connexion.
          pids: 300
        reservations:
          memory: 512M

  # =============================================================================
  # CONNECTION POOLING - PgBouncer
  # =============================================================================
  pgbouncer:
    # NOTE: consider running non-root + read_only with a tmpfs for its runtime
    # dir once verified against the image (finding L14).
    image: edoburu/pgbouncer:v1.25.2-p0
    container_name: trackarr-pgbouncer
    restart: always
    # Match the privilege reduction every other service in the stack gets —
    # pgbouncer brokers the DB credentials, so a code-exec bug here must not
    # run as an escalatable root container (finding L14). pgbouncer is a
    # userspace proxy on port 6432, so it needs no Linux capabilities.
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    environment:
      # Requis par postgres.js (`prepare: true`) en pooling transaction. Le
      # défaut de PgBouncer est passé de 0 à 200 en 1.25 : posé explicitement
      # pour ne pas dépendre de la version du binaire. Voir la note dans
      # docker/pgbouncer/pgbouncer.ini.
      MAX_PREPARED_STATEMENTS: 200
      DATABASE_URL: postgres://${DB_USER:-tracker}:${DB_PASSWORD:?DB_PASSWORD must be set in .env — see .env.example}@postgres:5432/${DB_NAME:-trackarr}
      DB_HOST: postgres
      DB_USER: ${DB_USER:-tracker}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env — see .env.example}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 20
      MIN_POOL_SIZE: 5
      MAX_CLIENT_CONN: 500
      MAX_DB_CONNECTIONS: 100
      LISTEN_PORT: 6432
    expose:
      - "6432"
    networks:
      - trackarr-internal
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "6432"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================================
  # CACHE - Redis with persistence
  # =============================================================================
  redis:
    # Redis 8. RDB and AOF are forward-compatible from 7, so this one IS an
    # in-place bump — stop, pull, start. The 8.0 breaking change was ACL
    # categories absorbing the Search/JSON/timeseries commands, and this stack
    # authenticates with requirepass rather than ACLs, so it is unaffected.
    image: redis:8.10.1-alpine
    container_name: trackarr-redis
    restart: always
    # Redis only writes to /data (volume-mounted below) — locking the
    # rootfs is safe. Minimal tmpfs covers any transient files Redis
    # might touch (e.g. RDB temp file before rename, latency monitor).
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --auto-aof-rewrite-percentage 100
      --auto-aof-rewrite-min-size 64mb
      --save 900 1
      --save 300 10
      --save 60 10000
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env — see .env.example}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 300
      --timeout 0
      --tcp-backlog 511
      --maxclients 5000
      --protected-mode yes
      --bind 0.0.0.0
      --rename-command FLUSHALL ""
      --rename-command FLUSHDB ""
      --rename-command DEBUG ""
      --rename-command CONFIG ""
      --rename-command KEYS ""
      --rename-command SHUTDOWN ""
      --loglevel warning
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - trackarr-internal
    deploy:
      resources:
        limits:
          memory: 768M
          pids: 100
        reservations:
          memory: 256M

networks:
  trackarr-public:
    driver: bridge
  trackarr-internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  caddy_logs:
    driver: local
  # Only used with STORAGE_DRIVER=fs (the default). With `s3` the API writes
  # to the bucket instead and nothing mounts this — but it is left declared so
  # switching back, or copying the old files out, needs no edit here.
  uploads_data:
    driver: local
